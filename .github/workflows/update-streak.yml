name: Update profile SVGs

on:
  schedule:
    # Every 30 minutes for near-live numbers
    - cron: "*/30 * * * *"
  workflow_dispatch:
  push:
    paths:
      - "scripts/generate_streak.py"
      - "scripts/generate_activity_graph.py"
      - "scripts/update_readme_cache_bust.py"
      - ".github/workflows/update-streak.yml"

concurrency:
  group: update-streak
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.STREAK_GITHUB_TOKEN || github.token }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Generate streak + activity SVGs
        env:
          GITHUB_TOKEN: ${{ secrets.STREAK_GITHUB_TOKEN || github.token }}
          GITHUB_USERNAME: shrey1110-dotcom
        run: |
          python3 scripts/generate_streak.py
          python3 scripts/generate_activity_graph.py
          python3 scripts/update_readme_cache_bust.py

      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/github-streak.svg assets/activity-graph.svg README.md
          if git diff --staged --quiet; then
            echo "No SVG changes"
            exit 0
          fi
          git commit -m "chore: refresh profile activity SVGs"
          git pull --rebase origin main
          git push
